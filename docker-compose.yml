version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: marilan_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marilan_intervencoes
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./marilan-back/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./marilan-back
    container_name: marilan_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_DATABASE: marilan_intervencoes
    volumes:
      - ./marilan-back:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build: ./marilan-front
    container_name: marilan_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./marilan-front:/app
      - /app/node_modules
    command: npm run dev

volumes:
  db_data: